<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendar Cita — Agenda Manicura ✨</title>
  <meta name="description" content="Agenda tu cita de manicura: elige servicio, fecha y hora disponible. Confirmación instantánea por WhatsApp.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ═══════════ HEADER ═══════════ -->
  <header class="app-header">
    <div class="header-inner">
      <a href="index.html" class="header-brand">
        <span class="header-back" aria-label="Volver a inicio">←</span>
        💅 Agenda Manicura
      </a>
      <nav class="header-actions">
        <button id="btnNuevaCita" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Nueva Cita
        </button>
        <button id="btnConfigServicios" class="btn btn-outline">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Servicios
        </button>
        <button id="btnExportar" class="btn btn-outline">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Exportar
        </button>
        <label class="btn btn-outline btn-file">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Importar
          <input type="file" id="inputImportar" accept=".json" hidden>
        </label>
      </nav>
    </div>
  </header>

  <!-- ═══════════ TABS ═══════════ -->
  <section class="tabs-bar">
    <div class="tabs-inner">
      <button class="tab active" data-tab="lista">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        Vista de Lista
      </button>
      <button class="tab" data-tab="calendario">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Calendario Semanal
      </button>
    </div>
  </section>

  <!-- ═══════════ VISTA LISTA ═══════════ -->
  <main id="vistaLista" class="view active">
    <div class="view-inner">
      <div class="filtros">
        <label>Fecha:
          <input type="date" id="filtroFecha">
        </label>
        <label>Estado:
          <select id="filtroEstado">
            <option value="">Todos</option>
            <option value="pendiente">Pendiente</option>
            <option value="confirmada">Confirmada</option>
            <option value="completada">Completada</option>
            <option value="cancelada">Cancelada</option>
          </select>
        </label>
      </div>
      <div id="listaCitas" class="lista-citas"></div>
    </div>
  </main>

  <!-- ═══════════ VISTA CALENDARIO ═══════════ -->
  <main id="vistaCalendario" class="view">
    <div class="view-inner">
      <div class="cal-nav">
        <button id="calPrev" class="btn btn-sm">← Semana anterior</button>
        <button id="calHoy" class="btn btn-sm btn-primary">Hoy</button>
        <button id="calNext" class="btn btn-sm">Semana siguiente →</button>
        <span id="calRango" class="cal-rango"></span>
      </div>
      <div class="cal-grid-wrapper">
        <div id="calGrid" class="cal-grid"></div>
      </div>
    </div>
  </main>

  <!-- ═══════════ MODAL: NUEVA / EDITAR CITA ═══════════ -->
  <div id="modalCita" class="modal-overlay" hidden>
    <div class="modal">
      <button class="modal-close" data-close aria-label="Cerrar">&times;</button>
      <h2 id="modalCitaTitulo">Nueva Cita</h2>
      <form id="formCita" autocomplete="off">
        <input type="hidden" id="citaId">

        <label>Nombre de la clienta *
          <input type="text" id="citaNombre" required maxlength="80" placeholder="Ej: María López">
        </label>

        <label>WhatsApp *
          <div class="input-group">
            <input type="text" id="citaIndicativo" value="+57" maxlength="5" class="indicativo">
            <input type="tel" id="citaTelefono" required placeholder="3001234567" pattern="[0-9]{7,15}">
          </div>
        </label>

        <label>Servicio *
          <select id="citaServicio" required>
            <option value="">Seleccionar…</option>
          </select>
        </label>

        <div class="info-servicio" id="infoServicio" hidden>
          <span id="infoDuracion"></span> · <span id="infoPrecio"></span>
        </div>

        <label>Fecha *
          <input type="date" id="citaFecha" required>
        </label>

        <label>Hora disponible *
          <select id="citaHora" required>
            <option value="">Elige servicio y fecha primero</option>
          </select>
        </label>

        <label>Notas
          <textarea id="citaNotas" rows="2" maxlength="300" placeholder="Preferencias, alergias, etc."></textarea>
        </label>

        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg>
            Guardar Cita
          </button>
          <button type="button" class="btn btn-whatsapp" id="btnGuardarYWhatsapp">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.625.846 5.059 2.284 7.034L.789 23.492a.5.5 0 0 0 .613.613l4.458-1.495A11.952 11.952 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-2.387 0-4.595-.8-6.362-2.147l-.444-.345-3.07 1.028 1.028-3.07-.345-.444A9.962 9.962 0 0 1 2 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/></svg>
            Guardar y WhatsApp
          </button>
          <button type="button" class="btn btn-outline" data-close>Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ═══════════ MODAL: DETALLE CITA ═══════════ -->
  <div id="modalDetalle" class="modal-overlay" hidden>
    <div class="modal">
      <button class="modal-close" data-close aria-label="Cerrar">&times;</button>
      <h2>Detalle de Cita</h2>
      <div id="detalleContenido"></div>
      <div class="modal-actions" id="detalleAcciones"></div>
    </div>
  </div>

  <!-- ═══════════ MODAL: CONFIGURAR SERVICIOS ═══════════ -->
  <div id="modalServicios" class="modal-overlay" hidden>
    <div class="modal modal-wide">
      <button class="modal-close" data-close aria-label="Cerrar">&times;</button>
      <h2>Configurar Servicios</h2>
      <div id="listaServicios"></div>
      <hr>
      <h3 id="formServicioTitulo">Agregar servicio</h3>
      <form id="formServicio" autocomplete="off">
        <input type="hidden" id="servicioId">
        <label>Nombre *
          <input type="text" id="servicioNombre" required maxlength="60">
        </label>
        <label>Duración (min) *
          <input type="number" id="servicioDuracion" required min="10" max="300" step="5">
        </label>
        <label>Precio COP *
          <input type="number" id="servicioPrecio" required min="0" step="500">
        </label>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg>
            Guardar servicio
          </button>
          <button type="button" class="btn btn-outline" id="btnCancelarServicio">Cancelar edición</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ═══════════ TOAST ═══════════ -->
  <div id="toast" class="toast" hidden></div>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
